const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const fail=(line,msg)=>{throw new Error('Linha '+line+': '+msg)};
function clean(text){return text.replace(/\r/g,'').split('\n').map((raw,i)=>{let s='',quoted=false;for(let p=0;p<raw.length;p++){if(raw[p]==='"')quoted=!quoted;if(!quoted&&raw.substring(p,p+2)==='//')break;s+=raw[p]}return {line:i+1,s:s.trim()}}).filter(x=>x.s)}
function splitArgs(s,line){let out=[],part='',depth=0,quote=false;for(const c of s){if(c==='"')quote=!quote;if(!quote){if(c==='(')depth++;if(c===')')depth--;if(depth<0)fail(line,'Parênteses desequilibrados.');if(c===','&&depth===0){out.push(part.trim());part='';continue}}part+=c}if(quote||depth!==0)fail(line,'Feche aspas e parênteses.');if(part.trim())out.push(part.trim());return out}
function tokenize(s,line){let out=[],p=0;while(p<s.length){if(/\s/.test(s[p])){p++;continue}const rest=s.slice(p);let m;if(s[p]==='"'){let q=p+1;while(q<s.length&&s[q]!=='"')q++;if(q===s.length)fail(line,'Texto sem aspas finais.');out.push({t:'str',v:s.slice(p+1,q)});p=q+1;continue}if((m=rest.match(/^\d+(?:\.\d+)?/))){out.push({t:'num',v:Number(m[0])});p+=m[0].length;continue}if((m=rest.match(/^[a-zA-Z_][\w]*/))){out.push({t:'id',v:m[0].toLowerCase()});p+=m[0].length;continue}if((m=rest.match(/^(<=|>=|<>|!=|==|[()+*\/^,\-<>=])/))){out.push({t:'op',v:m[0]});p+=m[0].length;continue}fail(line,'Símbolo inesperado: '+s[p])}out.push({t:'eof',v:''});return out}
function parseExpr(src,line,declared){const t=tokenize(src,line);let pos=0;const peek=()=>t[pos],take=()=>t[pos++];const bp={ou:1,e:2,'=':3,'==':3,'<>':3,'!=':3,'<':3,'>':3,'<=':3,'>=':3,'+':4,'-':4,'*':5,'/':5,div:5,mod:5,'^':7};function expr(min=0){let x=take(),left;if(x.t==='num'||x.t==='str')left={kind:'lit',val:x.v};else if(x.v==='('){left=expr();if(take().v!==')')fail(line,'Falta fechar parênteses.')}else if(x.v==='-'||x.v==='+'||x.v==='nao')left={kind:'un',op:x.v,a:expr(6)};else if(x.t==='id'){if(x.v==='verdadeiro'||x.v==='falso')left={kind:'lit',val:x.v==='verdadeiro'};else if(peek().v==='('){take();let args=[];if(peek().v!==')'){while(true){args.push(expr());if(peek().v!==',')break;take()}}if(take().v!==')')fail(line,'Falta ) na função.');if(!['abs','raizq','int','arred','sen','cos'].includes(x.v)||args.length!==1)fail(line,'Função desconhecida ou com argumentos inválidos: '+x.v);left={kind:'fn',fn:x.v,args}}else{if(!declared.has(x.v))fail(line,'Variável "'+x.v+'" não foi declarada na seção var.');left={kind:'var',name:x.v}}}else fail(line,'Expressão incompleta.');while(true){const next=peek();const power=bp[next.v];if(power==null||power<min)break;const op=take().v;left={kind:'bin',op,a:left,b:expr(op==='^'?power:power+1)}}return left}const ast=expr();if(peek().t!=='eof')fail(line,'Expressão inválida perto de '+peek().v);return ast}
function parseProgram(text){const lines=clean(text);if(!lines.length)throw Error('O editor está vazio.');let p=0,types=new Map();if(!/^algoritmo\s+"[^"]+"$/i.test(lines[p].s))fail(lines[p].line,'Comece com algoritmo "nome".');p++;if(lines[p]?.s.toLowerCase()==='var'){p++;while(p<lines.length&&lines[p].s.toLowerCase()!=='inicio'){let m=lines[p].s.match(/^([\w\s,]+)\s*:\s*(inteiro|real|caractere|logico)\s*$/i);if(!m)fail(lines[p].line,'Declaração esperada: a, b: inteiro');for(let v of m[1].split(',').map(x=>x.trim().toLowerCase())){if(!/^[a-zA-Z_]\w*$/.test(v)||types.has(v))fail(lines[p].line,'Nome de variável inválido ou repetido: '+v);types.set(v,m[2].toLowerCase())}p++}}if(lines[p]?.s.toLowerCase()!=='inicio')fail(lines[p]?.line||lines.at(-1).line,'Inclua a palavra inicio depois das declarações.');p++;const vars=new Set(types.keys());if(!types.size)fail(lines[p-1].line,'Declare pelo menos uma variável em var.');function ex(t,l){return parseExpr(t,l,vars)}function block(stops){let body=[];while(p<lines.length){let {s,line}=lines[p],low=s.toLowerCase();if(stops.some(v=>low===v||v==='ate'&&low.startsWith('ate ')))break;let m;if((m=s.match(/^se\s+(.+)\s+entao$/i))){p++;let yes=block(['senao','fimse']),no=[];if(lines[p]?.s.toLowerCase()==='senao'){p++;no=block(['fimse'])}if(lines[p]?.s.toLowerCase()!=='fimse')fail(line,'Falta fimse.');p++;body.push({type:'if',c:ex(m[1],line),yes,no,line})}else if((m=s.match(/^enquanto\s+(.+)\s+faca$/i))){p++;const b=block(['fimenquanto']);if(lines[p]?.s.toLowerCase()!=='fimenquanto')fail(line,'Falta fimenquanto.');p++;body.push({type:'while',c:ex(m[1],line),body:b,line})}else if((m=s.match(/^para\s+([a-zA-Z_]\w*)\s+de\s+(.+)\s+ate\s+(.+?)(?:\s+passo\s+(.+?))?\s+faca$/i))){const v=m[1].toLowerCase();if(!vars.has(v))fail(line,'Declare a variável do contador: '+v);p++;const b=block(['fimpara']);if(lines[p]?.s.toLowerCase()!=='fimpara')fail(line,'Falta fimpara.');p++;body.push({type:'for',v,start:ex(m[2],line),end:ex(m[3],line),step:m[4]?ex(m[4],line):null,body:b,line})}else if(low==='repita'){p++;let b=block(['ate']);if(!/^ate\s+.+/i.test(lines[p]?.s||''))fail(line,'Falta ate condicao.');const last=lines[p];p++;body.push({type:'repeat',c:ex(last.s.replace(/^ate\s+/i,''),last.line),body:b,line})}else if((m=s.match(/^leia\s*\((.*)\)$/i))){let args=splitArgs(m[1],line).map(a=>a.toLowerCase());if(!args.length||args.some(a=>!vars.has(a)))fail(line,'leia() precisa conter variáveis declaradas.');body.push({type:'read',args,line});p++}else if((m=s.match(/^(escreva|escreval)\s*\((.*)\)$/i))){let parts=splitArgs(m[2],line);body.push({type:'write',nl:m[1].toLowerCase()==='escreval',args:parts.map(a=>ex(a,line)),line});p++}else if((m=s.match(/^([a-zA-Z_]\w*)\s*<-\s*(.+)$/))){let v=m[1].toLowerCase();if(!vars.has(v))fail(line,'Variável "'+v+'" não foi declarada.');body.push({type:'set',v,val:ex(m[2],line),line});p++}else fail(line,'Comando inválido ou mal escrito: '+s)}return body}let code=block(['fimalgoritmo']);if(lines[p]?.s.toLowerCase()!=='fimalgoritmo')fail(lines.at(-1).line,'Finalize com fimalgoritmo.');p++;if(p!==lines.length)fail(lines[p].line,'Há comandos depois de fimalgoritmo.');return {types,code}}
function evaluate(a,vars){if(a.kind==='lit')return a.val;if(a.kind==='var')return vars[a.name];if(a.kind==='un'){const v=evaluate(a.a,vars);return a.op==='-'?-Number(v):a.op==='+'?Number(v):!Boolean(v)}if(a.kind==='fn'){let n=Number(evaluate(a.args[0],vars));return ({abs:Math.abs,raizq:Math.sqrt,int:Math.trunc,arred:Math.round,sen:Math.sin,cos:Math.cos})[a.fn](n)}const x=evaluate(a.a,vars),y=evaluate(a.b,vars);switch(a.op){case'+':return Number(x)+Number(y);case'-':return x-y;case'*':return x*y;case'/':if(y===0)throw Error('Divisão por zero.');return x/y;case'div':if(y===0)throw Error('Divisão por zero.');return Math.trunc(x/y);case'mod':if(y===0)throw Error('Módulo por zero.');return x%y;case'^':return Math.pow(x,y);case'=':case'==':return x===y;case'<>':case'!=':return x!==y;case'<':return x<y;case'>':return x>y;case'<=':return x<=y;case'>=':return x>=y;case'e':return Boolean(x)&&Boolean(y);case'ou':return Boolean(x)||Boolean(y)}throw Error('Operador não suportado')}
function execute(program,inputs){const vars={};for(const [v,t] of program.types)vars[v]=t==='caractere'?'':t==='logico'?false:0;let reads=0,steps=0,buffer='',out=[];function ev(a){const v=evaluate(a,vars);if(typeof v==='number'&&!Number.isFinite(v))throw Error('Resultado matemático inválido.');return v}function set(v,value){const type=program.types.get(v);if(type==='inteiro')vars[v]=Math.trunc(Number(value));else if(type==='real')vars[v]=Number(value);else if(type==='logico')vars[v]=Boolean(value);else vars[v]=String(value)}function tick(line){if(++steps>15000)throw Error('Possível laço infinito (limite de 15.000 passos), próximo da linha '+line+'.')}function run(nodes){for(const n of nodes){tick(n.line);switch(n.type){case'set':set(n.v,ev(n.val));break;case'read':for(const key of n.args){if(reads>=inputs.length)throw Error('Seu código chamou leia() vezes demais.');set(key,inputs[reads++])}break;case'write':{const str=n.args.map(x=>{let v=ev(x);return typeof v==='boolean'?(v?'VERDADEIRO':'FALSO'):String(v)}).join(' ');buffer+=str;if(n.nl){out.push(buffer);buffer=''}if(out.length>110)throw Error('Excesso de linhas na saída.');break}case'if':run(ev(n.c)?n.yes:n.no);break;case'while':while(ev(n.c)){tick(n.line);run(n.body)}break;case'for':{const start=Number(ev(n.start)),end=Number(ev(n.end)),step=n.step?Number(ev(n.step)):1;if(!Number.isFinite(start+end+step)||step===0)throw Error('Passo de para inválido.');for(let i=start;step>0?i<=end:i>=end;i+=step){tick(n.line);set(n.v,i);run(n.body)}break}case'repeat':do{tick(n.line);run(n.body)}while(!ev(n.c));break}}}run(program.code);if(buffer)out.push(buffer);if(reads!==inputs.length)throw Error('Leia exatamente '+inputs.length+' valor(es) de entrada; seu código leu '+reads+'.');return out.filter(x=>x.trim()!=='')}

 if(p.k==='double'||p.k==='sequence'){return numbers.length===expected.length&&expected.every((v,i)=>equals(numbers[i],v))}
 if(['parity','prime','class'].includes(p.k))return norm(raw)===norm(expected);
 return numbers.length>0&&equals(numbers[numbers.length-1],expected)
}
function pFor(i){return i<10?T[i]:E[i-10]}
function template(i){let p=pFor(i);return i<10?p.code:'algoritmo "exercicio_'+String(i-9).padStart(2,'0')+'"\nvar\n  '+p.v+'\ninicio\n'+p.r.map(v=>'  leia('+v+')').join('\n')+'\n\n  // Escreva sua solução aqui\n\nfimalgoritmo'}
function save(){try{localStorage.setItem(stateKey,JSON.stringify({step,done:[...done],quizDone:[...quizDone],drafts,attempts}));}catch(e){}}
function load(){if(loaded)return;loaded=true;try{const o=JSON.parse(localStorage.getItem(stateKey)||'null');if(o){done=new Set((o.done||[]).filter(Number.isInteger));quizDone=new Set((o.quizDone||[]).filter(Number.isInteger));drafts=o.drafts||{};attempts=o.attempts||{};let furthest=0;while(furthest<24&&done.has(furthest))furthest++;step=Math.max(0,Math.min(Number.isInteger(o.step)?o.step:furthest,furthest));}}catch(e){}}
function isUnlocked(i){return i===0||done.has(i-1)}
function setPrimary(text,disabled=false){$('primary').textContent=text;$('primary').disabled=disabled}
function nav(on){$('back').hidden=!on;$('map').hidden=!on;$('counter').hidden=!on;$('counter').textContent=String(step+1).padStart(2,'0')+' / 25';$('barFill').style.width=(100*done.size/25)+'%'}
function feedback(text,kind=''){const el=$('feedback');if(!el)return;el.hidden=!text;el.className='feedback'+(kind?' '+kind:'');el.textContent=text}
function showWelcome(){mode='welcome';nav(false);$('main').className='welcome';$('main').innerHTML=`<div class="grow"></div><div class="hero-symbol"><span>{·}</span></div><div class="eyebrow">PROGRAMAR DO ZERO</div><h1>Aprenda lógica.\nEscreva código.</h1><p>Primeiro, veja exemplos visuais. Depois, responda perguntas e pratique código com correção automática.</p><div class="badges"><span class="pill">✓ 10 lições rápidas</span><span class="pill">✓ 15 desafios</span><span class="pill">✓ Tente quantas vezes quiser</span></div><div class="grow"></div>`;$('extra').hidden=true;setPrimary('Começar treinamento →');$('footer').querySelector('.primary').onclick=()=>{if(!isUnlocked(step))step=0;openStep(step,step<10?'teach':'code')};save()}
function openStep(i,to='teach'){
 if(i<0||i>24||!isUnlocked(i))return;
 step=i;selected=-1;quizReady=false;passedNow=false;hintOpen=false;teachPage=0;
 mode=i>=10?'code':to==='code'?'code':to==='quiz'?'quiz':'teach';
 render();save();
}
function render(){
 nav(true);$('main').className='';$('extra').hidden=true;
 if(mode==='teach')renderTeach();
 else if(mode==='quiz')renderQuiz();
 else if(mode==='code')renderCode();
 else if(mode==='finished')renderFinished();
}
function renderQuiz(){const q=Q[step];$('main').innerHTML=`<div class="lesson-intro"><div class="eyebrow">TUTORIAL · LIÇÃO ${step+1}/10</div><h2>${safe(T[step].t)}</h2><div class="concept"><span class="bulb">✦</span><span>${safe(q.short)}<code>${safe(q.ex)}</code></span></div><div class="question">${safe(q.q)}</div></div><div class="options" id="options">${q.o.map((v,i)=>`<button class="option" data-choice="${i}" type="button"><span class="radio">${String.fromCharCode(65+i)}</span><span>${safe(v)}</span></button>`).join('')}</div><div id="feedback" role="status" aria-live="polite" hidden></div>`;
 $('options').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(quizReady)return;selected=Number(b.dataset.choice);paintChoice();feedback('')});
 setPrimary('Conferir resposta',true);$('primary').onclick=onQuizAction;}
function paintChoice(){const buttons=[...$('options').querySelectorAll('button')];buttons.forEach((b,i)=>{b.classList.toggle('selected',selected===i);b.classList.remove('wrong','correct')});setPrimary('Conferir resposta',selected<0)}
function onQuizAction(){if(quizReady){openStep(step,'code');return}if(selected<0)return;const q=Q[step];if(selected===q.a){quizReady=true;quizDone.add(step);$('options').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('correct',i===q.a));feedback('✓ Certo! Agora vamos escrever um pouco de código.','ok');setPrimary('Escrever código →');save()}else{$('options').querySelectorAll('button')[selected].classList.add('wrong');feedback('Ainda não. '+q.tip,'err');setPrimary('Conferir resposta',false)}}
function renderCode(){const p=pFor(step),isTut=step<10;const title=isTut?p.t:p.t;const desc=isTut?tasks[step]:p.d;const sample=isTut?undefined:p.ex;const code=typeof drafts[step]==='string'?drafts[step]:template(step);
 $('main').innerHTML=`<div class="code-title"><div class="eyebrow">${isTut?`PRÁTICA · LIÇÃO ${step+1}/10`:`EXERCÍCIO ${step-9}/15 · ${safe(p.l)}`}</div><h2>${safe(title)}</h2><p class="lead">${safe(desc)}</p></div>${sample?`<div class="mini-example">${safe(sample)}</div>`:''}<div class="editor-wrap"><textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Seu código VisuAlg"></textarea></div><div class="code-helper"><span class="editor-caption">EDITAR CÓDIGO</span><span><button id="hintBtn" class="link" type="button">Dica</button> · <button id="resetBtn" class="link" type="button">Refazer</button></span></div><div class="result-status"><div id="feedback" class="feedback code-feedback" role="status" aria-live="polite" hidden></div></div>`;
 $('editor').value=code;$('editor').addEventListener('input',()=>{drafts[step]=$('editor').value;passedNow=false;setPrimary('▶ Compilar e testar');$('primary').onclick=compile;feedback('');save()});
 $('hintBtn').onclick=()=>{hintOpen=!hintOpen;feedback(hintOpen?'💡 '+p.hint:'',hintOpen?'warn':'')};
 $('resetBtn').onclick=()=>{if($('editor').value!==template(step)&&!confirm('Refazer esta prática desde o começo?'))return;drafts[step]=template(step);$('editor').value=drafts[step];passedNow=false;hintOpen=false;feedback('Código restaurado. Tente novamente.');setPrimary('▶ Compilar e testar');$('primary').onclick=compile;save()};
 if(done.has(step))feedback('✓ Você já passou nesta etapa. Pode refazer o código.','ok');
 setPrimary('▶ Compilar e testar');$('primary').onclick=compile;}
function compile(){drafts[step]=$('editor').value;save();let parsed;try{parsed=parseProgram(drafts[step])}catch(e){passedNow=false;feedback('⛔ Não compilou. '+e.message,'err');return}
 const p=pFor(step);attempts[step]=(attempts[step]||0)+1;for(let i=0;i<p.cases.length;i++){
  const [values,expected]=p.cases[i];let outputs;try{outputs=execute(parsed,values)}catch(e){feedback('⛔ Teste '+(i+1)+': '+e.message,'err');save();return}
  if(!check(p,outputs,expected)){
   let v=values.length?values.map(format).join(' e '):'sem entrada';let exp=Array.isArray(expected)?expected.map(format).join(' e '):format(expected);
   feedback('⚠️ Teste '+(i+1)+' não passou. Entrada: '+v+' · Esperado: '+exp+' · Obtido: '+(outputs.length?outputs.join(' | '):'nenhuma saída')+'.','warn');save();return
  }
 }
 passedNow=true;done.add(step);save();feedback('✓ Aprovado! '+p.cases.length+(p.cases.length===1?' teste passou.':' testes passaram.')+' Você pode avançar.','ok');setPrimary(step===24?'Ver conquista →':'Próxima etapa →');$('primary').onclick=nextStep;
}
function nextStep(){if(!passedNow)return;if(step===24){mode='finished';renderFinished();return}openStep(step+1,step+1<10?'teach':'code')}
function renderFinished(){mode='finished';nav(false);$('main').className='completion';$('main').innerHTML='<div class="grow"></div><div class="hero-symbol"><span>✓</span></div><div class="eyebrow">TREINAMENTO CONCLUÍDO</div><h1>Missão cumprida!</h1><p class="lead">Você dominou o básico da lógica de programação e resolveu todos os desafios de matemática.</p><div class="stat-big">25 de 25 etapas ✓</div><div class="grow"></div>';$('extra').hidden=false;$('extra').textContent='Ver minhas etapas';$('extra').onclick=showMap;setPrimary('Treinar novamente →');$('primary').onclick=()=>{openStep(0,'teach')};save()}
function back(){
 if(mode==='welcome')return;
 if(mode==='finished'){showWelcome();return}
 if(mode==='teach'){
  if(teachPage>0){teachPage--;renderTeach();return}
  if(step===0){showWelcome();return}
  openStep(step-1,step-1<10?'code':'code');return;
 }
 if(mode==='quiz'){mode='teach';teachPage=TEACH[step].length-1;render();return}
 if(mode==='code'&&step<10){openStep(step,'quiz');return}
 if(step===0){showWelcome();return}
 openStep(step-1,'code');
}
function showMap(){const m=$('mapModal'),root=$('stageList');root.replaceChildren();for(let i=0;i<25;i++){if(i===0||i===10){const label=document.createElement('div');label.className='group-label';label.textContent=i===0?'Tutorial · 10 lições':'Matemática · 15 exercícios';root.append(label)}let b=document.createElement('button');b.className='stage-tile'+(i===step?' current':'')+(done.has(i)?' solved':'');b.disabled=!isUnlocked(i);b.innerHTML='<span>'+(done.has(i)?'✓':i<10?i+1:i-9)+'</span><small>'+(i<10?'Lição':'Exerc.')+'</small>';b.title=pFor(i).t;b.onclick=()=>{m.hidden=true;openStep(i,i<10?'teach':'code')};root.append(b)}m.hidden=false}
$('back').onclick=back;$('map').onclick=showMap;$('closeMap').onclick=()=>{$('mapModal').hidden=true};
$('primary').onclick=()=>{openStep(step,step<10?'teach':'code')};
load();showWelcome();

})();</script></body></html>
